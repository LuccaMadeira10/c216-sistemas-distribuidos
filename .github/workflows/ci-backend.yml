name: CI - Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    name: Ruff
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Instalar o Poetry
        run: pipx install poetry==2.1.4

      - name: Configurar o Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "poetry"
          cache-dependency-path: backend/poetry.lock

      - name: Instalar as dependencias
        run: poetry install --no-root --no-interaction

      - name: Verificar a formatacao
        run: poetry run ruff format --check .

      - name: Verificar o codigo
        run: poetry run ruff check .

  testes:
    name: Pytest
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: c216_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d c216_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/c216_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Instalar o Poetry
        run: pipx install poetry==2.1.4

      - name: Configurar o Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "poetry"
          cache-dependency-path: backend/poetry.lock

      - name: Instalar as dependencias
        run: poetry install --no-root --no-interaction

      - name: Executar os testes
        run: poetry run python -m pytest tests
