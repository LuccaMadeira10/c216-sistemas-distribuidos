name: CI - Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  frontend:
    name: Biome, Vitest, Build e Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4
      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar as dependencias
        run: npm ci
      - name: Verificar o codigo
        run: npm run lint
      - name: Verificar a formatacao
        run: npm run format:check
      - name: Executar os testes unitarios e de integracao
        run: npm run test
      - name: Gerar o build
        run: npm run build
      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium
      - name: Executar os testes E2E
        run: npm run test:e2e
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
