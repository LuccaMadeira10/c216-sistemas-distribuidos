services:
  backend:
    build: ./backend
    image: c216-backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/c216_db
    depends_on:
      db:
        condition: service_healthy
    # usa a rota mais simples pra conferir se a API subiu certo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - c216-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: c216_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # pg_isready ja vem junto na imagem do postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - c216-network

  worker:
    # reaproveita a imagem pois usa as mesmas dependencias do backend
    image: c216-backend
    command: python worker.py
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - c216-network

networks:
  c216-network:
    # nome fixo pra ficar facil de achar com docker network ls
    name: c216-network

volumes:
  postgres_data:
